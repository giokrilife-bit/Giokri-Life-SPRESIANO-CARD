<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registra acquisto · SPRESIANO CARD</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7f5;
  color:#1f2933;
}

.container{
  width:100%;
  max-width:680px;
  margin:0 auto;
  padding:20px 15px 40px;
}

.header{
  background:#fff;
  border-radius:18px;
  padding:24px 20px;
  text-align:center;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  margin-bottom:18px;
}

.logo{
  font-size:27px;
  font-weight:800;
  color:#176b45;
}

.subtitle{
  font-size:14px;
  color:#667085;
  margin-top:5px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:22px 20px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}

h2{
  margin:0 0 15px;
  font-size:20px;
  color:#176b45;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:700;
  font-size:14px;
}

input,select,textarea{
  width:100%;
  border:1px solid #d0d5dd;
  border-radius:11px;
  padding:13px 12px;
  font-size:16px;
  background:#fff;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:#176b45;
  box-shadow:0 0 0 3px rgba(23,107,69,.10);
}

.field{
  margin-bottom:17px;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px 16px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn-primary{
  background:#176b45;
  color:#fff;
}

.btn-secondary{
  background:#e8f2ed;
  color:#176b45;
  margin-top:10px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{
  display:none;
  border-radius:11px;
  padding:13px 14px;
  margin-top:15px;
  font-size:14px;
  line-height:1.45;
}

.status.info{
  display:block;
  background:#eef4ff;
  color:#2454a6;
}

.status.success{
  display:block;
  background:#eaf8ef;
  color:#176b45;
}

.status.error{
  display:block;
  background:#fff0f0;
  color:#b42318;
}

.card-info{
  display:none;
  background:#f2faf5;
  border:1px solid #cce7d5;
  border-radius:13px;
  padding:15px;
  margin-top:15px;
}

.card-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:4px 0;
  font-size:14px;
}

.card-row strong{
  color:#176b45;
}

#formAcquisto{
  display:none;
}

.shop-loading{
  font-size:13px;
  color:#667085;
  margin-top:7px;
}

.shop-count{
  margin-top:7px;
  font-size:13px;
  color:#176b45;
  font-weight:600;
}

.photo-help{
  font-size:13px;
  color:#667085;
  margin-top:7px;
  line-height:1.4;
}

.preview-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:12px;
}

.preview{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #d0d5dd;
}

.footer{
  text-align:center;
  color:#667085;
  font-size:12px;
  margin-top:20px;
}

.required{
  color:#b42318;
}

@media(max-width:480px){
  .container{padding:12px 10px 30px}
  .card{padding:18px 15px}
  .preview{height:120px}
}
</style>

</head>

<body>

<div class="container">

<div class="header">
  <div class="logo">Giokri Life</div>
  <div class="subtitle">SPRESIANO CARD · Registra un acquisto</div>
</div>

<div class="card">

<h2>1. Verifica la tua Card</h2>

<div class="field">
<label for="idCard">Numero Card</label>

<input
type="text"
id="idCard"
placeholder="Es. CARD-000001"
autocomplete="off"
autocapitalize="characters"

>

</div>

<button
type="button"
class="btn-primary"
id="btnVerifica"
onclick="verificaCard()">
VERIFICA CARD </button>

<div id="statusCard" class="status"></div>

<div id="cardInfo" class="card-info">

<div class="card-row">
<span>Card</span>
<strong id="infoCard"></strong>
</div>

<div class="card-row">
<span>Cliente</span>
<strong id="infoCliente"></strong>
</div>

<div class="card-row">
<span>Stato</span>
<strong id="infoStato"></strong>
</div>

<div class="card-row">
<span>Punti</span>
<strong id="infoPunti"></strong>
</div>

<div class="card-row">
<span>Livello</span>
<strong id="infoLivello"></strong>
</div>

</div>
</div>

<div class="card" id="formAcquisto">

<h2>2. Registra l'acquisto</h2>

<div class="field">

<label for="negozio">
Seleziona il negozio <span class="required">*</span>
</label>

<select id="negozio">
<option value="">Caricamento negozi...</option>
</select>

<div id="negozioLoading" class="shop-loading">
Sto caricando i negozi aderenti...
</div>

<div id="negozioCount" class="shop-count"></div>

</div>

<div class="field">

<label for="importo">
Importo dell'acquisto (€) <span class="required">*</span>
</label>

<input
type="number"
id="importo"
min="0.01"
step="0.01"
placeholder="Es. 35,50"

>

</div>

<div class="field">

<label for="foto">
Foto dello scontrino <span class="required">*</span>
</label>

<input
type="file"
id="foto"
accept="image/*"
capture="environment"
multiple

>

<div class="photo-help">
Inserisci almeno una foto dello scontrino.
Puoi caricare fino a 4 immagini.
</div>

<div id="previewGrid" class="preview-grid"></div>

</div>

<div class="field">

<label for="note">Note</label>

<textarea
  id="note"
  rows="3"
  placeholder="Eventuali note sull'acquisto..."></textarea>

</div>

<button
type="button"
class="btn-primary"
id="btnRegistra"
onclick="registraAcquisto()">
REGISTRA ACQUISTO </button>

<button
type="button"
class="btn-secondary"
onclick="nuovaVerifica()">
VERIFICA UN'ALTRA CARD </button>

<div id="statusAcquisto" class="status"></div>

</div>

<div class="footer">
Giokri Life · SPRESIANO CARD
</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxHaUH-tBV6IjSEB6nwGXCwe-C2BZ5iw5qXO2lABAQibULYh2c2b7z--dUcHMqQpksS/exec";

let cardVerificata=null;
let negoziCaricati=[];
let fotoSelezionate=[];


/* =========================================================
   JSONP
   ========================================================= */

function jsonp(url,timeout=15000){

return new Promise(function(resolve,reject){

const callbackName=
"giokriCallback_"+Date.now()+"_"+Math.floor(Math.random()*100000);

const script=document.createElement("script");

let timer=setTimeout(function(){

try{delete window[callbackName]}catch(e){}

if(script.parentNode){
script.parentNode.removeChild(script);
}

reject(new Error("Timeout di collegamento con Apps Script."));

},timeout);


window[callbackName]=function(data){

clearTimeout(timer);

try{delete window[callbackName]}catch(e){}

if(script.parentNode){
script.parentNode.removeChild(script);
}

resolve(data);

};


script.onerror=function(){

clearTimeout(timer);

try{delete window[callbackName]}catch(e){}

if(script.parentNode){
script.parentNode.removeChild(script);
}

reject(new Error("Errore di collegamento con Apps Script."));

};


const separatore=url.indexOf("?")>=0?"&":"?";

script.src=
url+
separatore+
"callback="+
encodeURIComponent(callbackName);

document.body.appendChild(script);

});

}


/* =========================================================
   STATUS
   ========================================================= */

function mostraStatus(id,tipo,messaggio){

const el=document.getElementById(id);

el.className="status "+tipo;
el.innerHTML=messaggio;
el.style.display="block";

}

function nascondiStatus(id){

const el=document.getElementById(id);

el.style.display="none";
el.innerHTML="";
el.className="status";

}


/* =========================================================
   VERIFICA CARD
   ========================================================= */

async function verificaCard(){

const input=document.getElementById("idCard");

const codice=
input.value.trim().toUpperCase();

if(!codice){

mostraStatus(
"statusCard",
"error",
"Inserisci il numero della Card."
);

input.focus();
return;

}

const btn=document.getElementById("btnVerifica");

btn.disabled=true;
btn.textContent="VERIFICA IN CORSO...";

nascondiStatus("statusCard");

document.getElementById("cardInfo").style.display="none";
document.getElementById("formAcquisto").style.display="none";


try{

const url=
API_URL+
"?azione=cercaCard"+
"&idCard="+
encodeURIComponent(codice);

const risposta=await jsonp(url);

console.log("RISPOSTA CERCA CARD:",risposta);

if(!risposta || risposta.success!==true){

cardVerificata=null;

mostraStatus(
"statusCard",
"error",
risposta && risposta.message
? risposta.message
: "Card non trovata."
);

return;

}


cardVerificata=risposta;


document.getElementById("infoCard").textContent=
risposta.idCard||codice;

document.getElementById("infoCliente").textContent=
((risposta.nome||"")+" "+(risposta.cognome||"")).trim()
||risposta.idCliente
||"-";

document.getElementById("infoStato").textContent=
risposta.stato||"-";

document.getElementById("infoPunti").textContent=
risposta.punti!==undefined?risposta.punti:"0";

document.getElementById("infoLivello").textContent=
risposta.livello||"BASIC";

document.getElementById("cardInfo").style.display="block";

mostraStatus(
"statusCard",
"success",
"✓ Card verificata correttamente."
);

document.getElementById("formAcquisto").style.display="block";

await caricaNegozi();

}catch(errore){

console.error("ERRORE VERIFICA CARD:",errore);

mostraStatus(
"statusCard",
"error",
errore.message||
"Errore di collegamento con Apps Script."
);

}finally{

btn.disabled=false;
btn.textContent="VERIFICA CARD";

}

}


/* =========================================================
   CARICA NEGOZI
   ========================================================= */

async function caricaNegozi(){

const select=document.getElementById("negozio");
const loading=document.getElementById("negozioLoading");
const count=document.getElementById("negozioCount");

select.innerHTML=
'<option value="">Caricamento negozi...</option>';

loading.textContent=
"Sto caricando i negozi aderenti...";

count.textContent="";


try{

const risposta=
await jsonp(
API_URL+
"?azione=getNegozi"
);

console.log("RISPOSTA COMPLETA GET NEGOZI:",risposta);


/*
=========================================================
GESTIONE DELLA RISPOSTA

Il tuo Apps Script restituisce i dati dei negozi.
Gestiamo sia:

1. risposta.negozi
2. risposta.data
3. risposta.result
4. risposta.risposta
5. risposta stessa se è un array
=========================================================
*/

let elenco=[];


if(Array.isArray(risposta)){

elenco=risposta;

}else if(risposta && Array.isArray(risposta.negozi)){

elenco=risposta.negozi;

}else if(risposta && Array.isArray(risposta.NEGOZI)){

elenco=risposta.NEGOZI;

}else if(risposta && Array.isArray(risposta.data)){

elenco=risposta.data;

}else if(risposta && Array.isArray(risposta.result)){

elenco=risposta.result;

}else if(risposta && Array.isArray(risposta.risposta)){

elenco=risposta.risposta;

}


/*
Se non abbiamo trovato un array,
controlliamo se la risposta contiene
direttamente gli elementi numerati.
*/

if(
elenco.length===0 &&
risposta &&
typeof risposta==="object"
){

const possibili=[];

Object.keys(risposta).forEach(function(chiave){

const valore=risposta[chiave];

if(
valore &&
typeof valore==="object" &&
!Array.isArray(valore)
){

if(
"NEGOZIO" in valore ||
"negozio" in valore ||
"NEGOZIO" in valore
){

possibili.push(valore);

}

}

});

if(possibili.length>0){

elenco=possibili;

}

}


console.log("ELENCO NEGOZI RICONOSCIUTO:",elenco);


/*
Se ancora non abbiamo trovato i negozi,
mostriamo un errore diagnostico.
*/

if(!Array.isArray(elenco) || elenco.length===0){

throw new Error(
"La risposta di Apps Script non contiene l'elenco dei negozi."
);

}


/*
=========================================================
CREAZIONE ELENCO
=========================================================
*/

negoziCaricati=[];

select.innerHTML=
'<option value="">-- Seleziona il negozio --</option>';


elenco.forEach(function(negozio,index){

if(!negozio || typeof negozio!=="object"){
return;
}


const id=
negozio.ID ??
negozio.id ??
negozio.Id ??
(index+1);


const nome=
negozio.NEGOZIO ??
negozio.negozio ??
negozio.Negozio ??
"";


const settore=
negozio.SETTORE ??
negozio.settore ??
negozio.Settore ??
"";


const attivo=
String(
negozio.ATTIVO ??
negozio.attivo ??
negozio.Attivo ??
"SI"
)
.trim()
.toUpperCase();


if(!nome){
return;
}


if(
attivo!=="SI" &&
attivo!=="SÌ" &&
attivo!=="TRUE" &&
attivo!=="1"
){

return;

}


negoziCaricati.push(negozio);


const option=document.createElement("option");

option.value=String(id);

option.textContent=
settore
? nome+" · "+settore
: nome;

select.appendChild(option);

});


if(negoziCaricati.length===0){

select.innerHTML=
'<option value="">Nessun negozio disponibile</option>';

loading.textContent=
"Nessun negozio attivo trovato.";

return;

}


loading.textContent=
"✓ Negozi caricati correttamente.";

count.textContent=
"✓ "+
negoziCaricati.length+
" negozi aderenti disponibili.";


}catch(errore){

console.error(
"ERRORE CARICAMENTO NEGOZI:",
errore
);

select.innerHTML=
'<option value="">Errore caricamento negozi</option>';

loading.textContent=
"Errore durante il caricamento.";

count.textContent="";


mostraStatus(
"statusAcquisto",
"error",
"Errore caricamento negozi: "+
errore.message
);

}

}


/* =========================================================
   FOTO
   ========================================================= */

document.getElementById("foto")
.addEventListener("change",function(event){

fotoSelezionate=
Array.from(event.target.files||[]).slice(0,4);

const grid=
document.getElementById("previewGrid");

grid.innerHTML="";


fotoSelezionate.forEach(function(file){

const reader=new FileReader();

reader.onload=function(event){

const img=document.createElement("img");

img.className="preview";
img.src=event.target.result;

grid.appendChild(img);

};

reader.readAsDataURL(file);

});

});


/* =========================================================
   COMPRESSIONE FOTO
   ========================================================= */

function comprimiImmagine(file){

return new Promise(function(resolve,reject){

const reader=new FileReader();

reader.onload=function(event){

const img=new Image();

img.onload=function(){

const max=1600;

let width=img.width;
let height=img.height;


if(width>max || height>max){

if(width>height){

height=Math.round(height*max/width);
width=max;

}else{

width=Math.round(width*max/height);
height=max;

}

}


const canvas=document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
width,
height
);


canvas.toBlob(function(blob){

if(!blob){

reject(
new Error("Impossibile elaborare l'immagine.")
);

return;

}


const readerBlob=new FileReader();

readerBlob.onloadend=function(){

resolve(readerBlob.result);

};

readerBlob.readAsDataURL(blob);

},"image/jpeg",.72);

};

img.onerror=function(){

reject(
new Error("Impossibile leggere l'immagine.")
);

};

img.src=event.target.result;

};

reader.onerror=function(){

reject(
new Error("Errore nella lettura dell'immagine.")
);

};

reader.readAsDataURL(file);

});

}


/* =========================================================
   REGISTRA ACQUISTO
   ========================================================= */

async function registraAcquisto(){

const negozio=
document.getElementById("negozio").value;

const importo=
parseFloat(
document.getElementById("importo").value.replace(",",".")
);

const note=
document.getElementById("note").value.trim();

const btn=
document.getElementById("btnRegistra");


if(!cardVerificata){

mostraStatus(
"statusAcquisto",
"error",
"Prima devi verificare una Card."
);

return;

}


if(!negozio){

mostraStatus(
"statusAcquisto",
"error",
"Seleziona il negozio."
);

return;

}


if(!importo || importo<=0){

mostraStatus(
"statusAcquisto",
"error",
"Inserisci un importo valido."
);

return;

}


if(fotoSelezionate.length===0){

mostraStatus(
"statusAcquisto",
"error",
"Devi inserire almeno una foto dello scontrino."
);

return;

}


btn.disabled=true;
btn.textContent="REGISTRAZIONE IN CORSO...";


try{

mostraStatus(
"statusAcquisto",
"info",
"Sto registrando l'acquisto..."
);


const immagini=[];


for(
let i=0;
i<fotoSelezionate.length && i<4;
i++
){

immagini.push(
await comprimiImmagine(
fotoSelezionate[i]
)
);

}


const dati={

azione:"registraAcquisto",

idCard:cardVerificata.idCard,

idCliente:cardVerificata.idCliente,

idNegozio:negozio,

importo:importo,

modalita:"SCONTRINO",

foto1:immagini[0]||"",

foto2:immagini[1]||"",

foto3:immagini[2]||"",

foto4:immagini[3]||"",

note:note

};


const corpo=new URLSearchParams();

Object.keys(dati).forEach(function(key){

corpo.append(
key,
dati[key]
);

});


await fetch(
API_URL,
{
method:"POST",
mode:"no-cors",
headers:{
"Content-Type":
"application/x-www-form-urlencoded;charset=UTF-8"
},
body:corpo.toString()
}
);


mostraStatus(
"statusAcquisto",
"success",
"✓ Acquisto registrato!<br><br>"+
"Card: <strong>"+
cardVerificata.idCard+
"</strong><br>"+
"Importo: <strong>€ "+
importo.toFixed(2).replace(".",",")+
"</strong>"
);


document.getElementById("importo").value="";
document.getElementById("note").value="";
document.getElementById("foto").value="";
document.getElementById("previewGrid").innerHTML="";

fotoSelezionate=[];


}catch(errore){

console.error(
"ERRORE REGISTRA ACQUISTO:",
errore
);

mostraStatus(
"statusAcquisto",
"error",
errore.message||
"Errore durante la registrazione dell'acquisto."
);

}finally{

btn.disabled=false;
btn.textContent="REGISTRA ACQUISTO";

}

}


/* =========================================================
   NUOVA CARD
   ========================================================= */

function nuovaVerifica(){

cardVerificata=null;

document.getElementById("idCard").value="";

document.getElementById("cardInfo").style.display="none";

document.getElementById("formAcquisto").style.display="none";

document.getElementById("negozio").innerHTML=
'<option value="">Seleziona il negozio</option>';

document.getElementById("importo").value="";

document.getElementById("note").value="";

document.getElementById("foto").value="";

document.getElementById("previewGrid").innerHTML="";

document.getElementById("negozioLoading").textContent="";

document.getElementById("negozioCount").textContent="";

fotoSelezionate=[];

nascondiStatus("statusCard");
nascondiStatus("statusAcquisto");

document.getElementById("idCard").focus();

}


document.addEventListener(
"DOMContentLoaded",
function(){

document.getElementById("idCard").focus();

}
);

</script>

</body>
</html>
