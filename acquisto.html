<script>

  /* =========================================================
     CONFIGURAZIONE
     ========================================================= */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxHaUH-tBV6IjSEB6nwGXCwe-C2BZ5iw5qXO2lABAQibULYh2c2b7z--dUcHMqQpksS/exec";


  let cardVerificata = null;
  let negoziCaricati = [];
  let fotoSelezionate = [];


  /* =========================================================
     JSONP
     ========================================================= */

  function jsonp(url, timeout = 15000) {

    return new Promise(function(resolve, reject) {

      const callbackName =
        "giokriCallback_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 100000);

      let script = document.createElement("script");
      let timer = null;

      window[callbackName] = function(data) {

        clearTimeout(timer);

        try {
          delete window[callbackName];
        } catch (e) {}

        if (script && script.parentNode) {
          script.parentNode.removeChild(script);
        }

        resolve(data);
      };

      script.onerror = function() {

        clearTimeout(timer);

        try {
          delete window[callbackName];
        } catch (e) {}

        if (script && script.parentNode) {
          script.parentNode.removeChild(script);
        }

        reject(new Error("Errore di collegamento con Apps Script."));
      };

      timer = setTimeout(function() {

        try {
          delete window[callbackName];
        } catch (e) {}

        if (script && script.parentNode) {
          script.parentNode.removeChild(script);
        }

        reject(new Error("Timeout di collegamento con Apps Script."));

      }, timeout);


      const separatore =
        url.indexOf("?") >= 0 ? "&" : "?";

      script.src =
        url +
        separatore +
        "callback=" +
        encodeURIComponent(callbackName);

      document.body.appendChild(script);

    });

  }


  /* =========================================================
     UTILITY
     ========================================================= */

  function mostraStatus(elementId, tipo, messaggio) {

    const elemento = document.getElementById(elementId);

    elemento.className = "status " + tipo;
    elemento.innerHTML = messaggio;
    elemento.style.display = "block";
  }


  function nascondiStatus(elementId) {

    const elemento = document.getElementById(elementId);

    elemento.style.display = "none";
    elemento.innerHTML = "";
    elemento.className = "status";

  }


  function normalizzaTesto(valore) {

    if (valore === null || valorе === undefined) {
      return "";
    }

    return String(valore).trim();

  }


  /* =========================================================
     VERIFICA CARD
     ========================================================= */

  async function verificaCard() {

    const input = document.getElementById("idCard");

    const codice =
      input.value
        .trim()
        .toUpperCase();

    if (!codice) {

      mostraStatus(
        "statusCard",
        "error",
        "Inserisci il numero della Card."
      );

      input.focus();
      return;
    }


    const btn =
      document.getElementById("btnVerifica");

    btn.disabled = true;
    btn.textContent = "VERIFICA IN CORSO...";

    nascondiStatus("statusCard");

    document.getElementById("cardInfo").style.display = "none";
    document.getElementById("formAcquisto").style.display = "none";


    try {

      /*
       * IMPORTANTE:
       * Apps Script utilizza idCard
       * e non codiceCard.
       */

      const url =
        API_URL +
        "?azione=cercaCard" +
        "&idCard=" +
        encodeURIComponent(codice);


      const risposta =
        await jsonp(url);


      console.log("RISPOSTA CERCA CARD:", risposta);


      if (!risposta || risposta.success !== true) {

        cardVerificata = null;

        mostraStatus(
          "statusCard",
          "error",
          risposta && risposta.message
            ? risposta.message
            : "Card non trovata. Controlla il numero inserito."
        );

        return;
      }


      cardVerificata = risposta;


      document.getElementById("infoCard").textContent =
        risposta.idCard || codice;

      document.getElementById("infoCliente").textContent =
        ((risposta.nome || "") + " " + (risposta.cognome || "")).trim()
        || risposta.idCliente
        || "-";

      document.getElementById("infoStato").textContent =
        risposta.stato || "-";

      document.getElementById("infoPunti").textContent =
        risposta.punti !== undefined
          ? risposta.punti
          : "0";

      document.getElementById("infoLivello").textContent =
        risposta.livello || "BASIC";


      document.getElementById("cardInfo").style.display = "block";


      mostraStatus(
        "statusCard",
        "success",
        "✓ Card verificata correttamente. Puoi registrare l'acquisto."
      );


      document.getElementById("formAcquisto").style.display = "block";


      await caricaNegozi();


    } catch (errore) {

      console.error("ERRORE VERIFICA CARD:", errore);

      cardVerificata = null;

      mostraStatus(
        "statusCard",
        "error",
        errore.message ||
        "Errore di collegamento con Apps Script."
      );

    } finally {

      btn.disabled = false;
      btn.textContent = "VERIFICA CARD";

    }

  }


  /* =========================================================
     CARICAMENTO NEGOZI
     ========================================================= */

  async function caricaNegozi() {

    const select =
      document.getElementById("negozio");

    const loading =
      document.getElementById("negozioLoading");

    const count =
      document.getElementById("negozioCount");


    select.innerHTML =
      '<option value="">Caricamento negozi...</option>';

    loading.textContent =
      "Sto caricando i negozi aderenti...";

    count.textContent = "";


    try {

      const risposta =
        await jsonp(
          API_URL +
          "?azione=getNegozi"
        );


      console.log("RISPOSTA GET NEGOZI:", risposta);


      if (!risposta || risposta.success !== true) {

        throw new Error(
          risposta && risposta.message
            ? risposta.message
            : "Impossibile caricare i negozi."
        );

      }


      /*
       * Apps Script restituisce:
       *
       * success
       * totale
       * negozi
       *
       * ma questa parte accetta anche eventuali
       * strutture alternative per maggiore robustezza.
       */

      let elenco = null;


      if (Array.isArray(risposta.negozi)) {
        elenco = risposta.negozi;
      }

      else if (Array.isArray(risposta.NEGOZI)) {
        elenco = risposta.NEGOZI;
      }

      else if (Array.isArray(risposta.data)) {
        elenco = risposta.data;
      }

      else if (Array.isArray(risposta.result)) {
        elenco = risposta.result;
      }

      else if (Array.isArray(risposta.risposta)) {
        elenco = risposta.risposta;
      }


      if (!elenco) {

        throw new Error(
          "Risposta ricevuta, ma non è stato trovato l'elenco dei negozi."
        );

      }


      /*
       * Mostriamo soltanto i negozi ATTIVI.
       */

      negoziCaricati =
        elenco.filter(function(negozio) {

          const attivo =
            String(
              negozio.ATTIVO ??
              negozio.attivo ??
              negozio.Attivo ??
              "SI"
            )
            .trim()
            .toUpperCase();

          return (
            attivo === "SI" ||
            attivo === "SÌ" ||
            attivo === "TRUE" ||
            attivo === "1"
          );

        });


      select.innerHTML =
        '<option value="">-- Seleziona il negozio --</option>';


      negoziCaricati.forEach(function(negozio) {

        const id =
          negozio.ID ??
          negozio.id ??
          negozio.Id ??
          "";

        const nome =
          negozio.NEGOZIO ??
          negozio.negozio ??
          negozio.Negozio ??
          "";

        const settore =
          negozio.SETTORE ??
          negozio.settore ??
          negozio.Settore ??
          "";


        if (!nome) {
          return;
        }


        const option =
          document.createElement("option");

        option.value = String(id);

        option.textContent =
          settore
            ? nome + " · " + settore
            : nome;


        select.appendChild(option);

      });


      if (negoziCaricati.length === 0) {

        select.innerHTML =
          '<option value="">Nessun negozio disponibile</option>';

        loading.textContent =
          "Nessun negozio attivo trovato.";

        return;
      }


      loading.textContent =
        "Negozi caricati correttamente.";

      count.textContent =
        "✓ " +
        negoziCaricati.length +
        " negozi aderenti disponibili.";


    } catch (errore) {

      console.error("ERRORE GET NEGOZI:", errore);


      select.innerHTML =
        '<option value="">Errore caricamento negozi</option>';


      loading.textContent =
        errore.message ||
        "Errore durante il caricamento dei negozi.";


      count.textContent = "";


      mostraStatus(
        "statusAcquisto",
        "error",
        "Impossibile caricare i negozi. Ricarica la pagina e riprova."
      );

    }

  }


  /* =========================================================
     FOTO
     ========================================================= */

  document
    .getElementById("foto")
    .addEventListener("change", function(event) {

      const files =
        Array.from(event.target.files || []);

      const selezionati =
        files.slice(0, 4);

      fotoSelezionate = selezionati;

      mostraAnteprime(selezionati);

    });


  function mostraAnteprime(files) {

    const grid =
      document.getElementById("previewGrid");

    grid.innerHTML = "";


    files.forEach(function(file) {

      const reader =
        new FileReader();


      reader.onload = function(event) {

        const img =
          document.createElement("img");

        img.className = "preview";

        img.src =
          event.target.result;

        grid.appendChild(img);

      };


      reader.readAsDataURL(file);

    });

  }


  /* =========================================================
     RIDUZIONE IMMAGINE
     ========================================================= */

  function comprimiImmagine(file) {

    return new Promise(function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload = function(event) {

        const img =
          new Image();


        img.onload = function() {

          const maxDimension = 1600;

          let width =
            img.width;

          let height =
            img.height;


          if (width > maxDimension || height > maxDimension) {

            if (width > height) {

              height =
                Math.round(
                  height * maxDimension / width
                );

              width =
                maxDimension;

            } else {

              width =
                Math.round(
                  width * maxDimension / height
                );

              height =
                maxDimension;

            }

          }


          const canvas =
            document.createElement("canvas");

          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext("2d");

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          canvas.toBlob(
            function(blob) {

              if (!blob) {

                reject(
                  new Error(
                    "Impossibile elaborare l'immagine."
                  )
                );

                return;
              }


              const readerBlob =
                new FileReader();


              readerBlob.onloadend =
                function() {

                  resolve(
                    readerBlob.result
                  );

                };


              readerBlob.readAsDataURL(blob);

            },
            "image/jpeg",
            0.72
          );

        };


        img.onerror =
          function() {

            reject(
              new Error(
                "Impossibile leggere l'immagine."
              )
            );

          };


        img.src =
          event.target.result;

      };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Errore nella lettura dell'immagine."
            )
          );

        };


      reader.readAsDataURL(file);

    });

  }


  /* =========================================================
     REGISTRA ACQUISTO
     ========================================================= */

  async function registraAcquisto() {

    const selectNegozio =
      document.getElementById("negozio");

    const importoInput =
      document.getElementById("importo");

    const noteInput =
      document.getElementById("note");

    const btn =
      document.getElementById("btnRegistra");


    if (!cardVerificata) {

      mostraStatus(
        "statusAcquisto",
        "error",
        "Prima devi verificare una Card."
      );

      return;

    }


    const idNegozio =
      selectNegozio.value;


    if (!idNegozio) {

      mostraStatus(
        "statusAcquisto",
        "error",
        "Seleziona il negozio."
      );

      selectNegozio.focus();
      return;

    }


    const importo =
      parseFloat(
        String(importoInput.value)
          .replace(",", ".")
      );


    if (!importo || importo <= 0) {

      mostraStatus(
        "statusAcquisto",
        "error",
        "Inserisci un importo valido."
      );

      importoInput.focus();
      return;

    }


    if (!fotoSelezionate || fotoSelezionate.length === 0) {

      mostraStatus(
        "statusAcquisto",
        "error",
        "Devi inserire almeno una foto dello scontrino."
      );

      return;

    }


    btn.disabled = true;
    btn.textContent = "REGISTRAZIONE IN CORSO...";


    mostraStatus(
      "statusAcquisto",
      "info",
      "Sto elaborando lo scontrino e registrando l'acquisto..."
    );


    try {

      const immagini = [];


      for (
        let i = 0;
        i < fotoSelezionate.length && i < 4;
        i++
      ) {

        const immagine =
          await comprimiImmagine(
            fotoSelezionate[i]
          );

        immagini.push(immagine);

      }


      const dati = {

        azione: "registraAcquisto",

        idCard:
          cardVerificata.idCard,

        idCliente:
          cardVerificata.idCliente,

        idNegozio:
          idNegozio,

        importo:
          importo,

        modalita:
          "SCONTRINO",

        foto1:
          immagini[0] || "",

        foto2:
          immagini[1] || "",

        foto3:
          immagini[2] || "",

        foto4:
          immagini[3] || "",

        note:
          noteInput.value.trim()

      };


      console.log(
        "DATI REGISTRA ACQUISTO:",
        {
          ...dati,
          foto1: dati.foto1 ? "[IMMAGINE]" : "",
          foto2: dati.foto2 ? "[IMMAGINE]" : "",
          foto3: dati.foto3 ? "[IMMAGINE]" : "",
          foto4: dati.foto4 ? "[IMMAGINE]" : ""
        }
      );


      /*
       * POST verso Apps Script.
       *
       * mode no-cors:
       * il browser non permette di leggere la risposta,
       * ma Apps Script riceve comunque la richiesta.
       */

      const corpo =
        new URLSearchParams();


      Object.keys(dati).forEach(function(chiave) {

        corpo.append(
          chiave,
          dati[chiave]
        );

      });


      await fetch(
        API_URL,
        {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type":
              "application/x-www-form-urlencoded;charset=UTF-8"
          },
          body: corpo.toString()
        }
      );


      mostraStatus(
        "statusAcquisto",
        "success",
        "✓ Acquisto registrato!<br><br>" +
        "Card: <strong>" +
        cardVerificata.idCard +
        "</strong><br>" +
        "Importo: <strong>€ " +
        importo.toFixed(2).replace(".", ",") +
        "</strong>"
      );


      /*
       * Pulizia del modulo dopo la registrazione.
       */

      importoInput.value = "";
      noteInput.value = "";
      document.getElementById("foto").value = "";
      document.getElementById("previewGrid").innerHTML = "";
      fotoSelezionate = [];


    } catch (errore) {

      console.error(
        "ERRORE REGISTRA ACQUISTO:",
        errore
      );


      mostraStatus(
        "statusAcquisto",
        "error",
        errore.message ||
        "Errore durante la registrazione dell'acquisto."
      );

    } finally {

      btn.disabled = false;
      btn.textContent = "REGISTRA ACQUISTO";

    }

  }


  /* =========================================================
     NUOVA VERIFICA
     ========================================================= */

  function nuovaVerifica() {

    cardVerificata = null;

    document.getElementById("idCard").value = "";

    document.getElementById("cardInfo").style.display = "none";

    document.getElementById("formAcquisto").style.display = "none";

    document.getElementById("negozio").innerHTML =
      '<option value="">Seleziona il negozio</option>';

    document.getElementById("importo").value = "";

    document.getElementById("note").value = "";

    document.getElementById("foto").value = "";

    document.getElementById("previewGrid").innerHTML = "";

    document.getElementById("negozioLoading").textContent = "";

    document.getElementById("negozioCount").textContent = "";

    fotoSelezionate = [];

    nascondiStatus("statusCard");
    nascondiStatus("statusAcquisto");

    document.getElementById("idCard").focus();

  }


  /* =========================================================
     AVVIO
     ========================================================= */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      document
        .getElementById("idCard")
        .focus();

    }
  );

</script>
