<script>

/* =====================================================
   CONFIGURAZIONE
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxHaUH-tBV6IjSEB6nwGXCwe-C2BZ5iw5qXO2lABAQibULYh2c2b7z--dUcHMqQpksS/exec";


/* =====================================================
   CALLBACK DASHBOARD
   ===================================================== */

function giokriAdminDashboard(data) {

  console.log("RISPOSTA DASHBOARD:", data);

  if (!data) {

    mostraErrore(
      "La Web App ha restituito una risposta vuota."
    );

    return;
  }


  document.getElementById("negozi").textContent =
    data.negozi ?? 0;

  document.getElementById("card").textContent =
    data.card ?? 0;

  document.getElementById("clienti").textContent =
    data.clienti ?? 0;

  document.getElementById("utilizzi").textContent =
    data.utilizzi ?? 0;

  document.getElementById("punti").textContent =
    data.punti ?? 0;

  document.getElementById("offerte").textContent =
    data.offerte ?? 0;


  document.getElementById("stato").textContent =
    "Collegamento attivo";

  document.getElementById("stato").className =
    "status ok";


  caricaNegozi();

}


/* =====================================================
   CALLBACK NEGOZI
   ===================================================== */

function giokriAdminNegozi(data) {

  console.log("RISPOSTA NEGOZI:", data);

  const tbody =
    document.getElementById("listaNegozi");


  tbody.innerHTML = "";


  let negozi = [];


  /*
   * getNegozi() può restituire direttamente
   * l'array oppure un oggetto contenente
   * l'array.
   */

  if (Array.isArray(data)) {

    negozi = data;

  }

  else if (
    data &&
    Array.isArray(data.negozi)
  ) {

    negozi = data.negozi;

  }

  else if (
    data &&
    Array.isArray(data.data)
  ) {

    negozi = data.data;

  }


  if (negozi.length === 0) {

    tbody.innerHTML =
      '<tr>' +
      '<td colspan="3" class="empty">' +
      'Nessun negozio trovato.' +
      '</td>' +
      '</tr>';

    return;

  }


  negozi.forEach(function(negozio) {

    const tr =
      document.createElement("tr");


    const tdNome =
      document.createElement("td");

    const tdSettore =
      document.createElement("td");

    const tdStato =
      document.createElement("td");


    /*
     * Supportiamo sia oggetti con proprietà
     * sia eventuali array.
     */

    if (
      negozio &&
      typeof negozio === "object" &&
      !Array.isArray(negozio)
    ) {

      tdNome.textContent =
        negozio.nome ||
        negozio.NEGOZIO ||
        negozio.negozio ||
        "-";

      tdSettore.textContent =
        negozio.settore ||
        negozio.SETTORE ||
        "-";

      tdStato.textContent =
        negozio.attivo ||
        negozio.ATTIVO ||
        "ATTIVO";

    }

    else if (Array.isArray(negozio)) {

      tdNome.textContent =
        negozio[1] || "-";

      tdSettore.textContent =
        negozio[2] || "-";

      tdStato.textContent =
        negozio[3] || "ATTIVO";

    }


    tr.appendChild(tdNome);
    tr.appendChild(tdSettore);
    tr.appendChild(tdStato);

    tbody.appendChild(tr);

  });

}


/* =====================================================
   ERRORE
   ===================================================== */

function mostraErrore(messaggio) {

  const box =
    document.getElementById("errore");

  box.textContent =
    messaggio;

  box.style.display =
    "block";


  document.getElementById("stato").textContent =
    "Errore collegamento";

  document.getElementById("stato").className =
    "status error";

}


/* =====================================================
   CARICAMENTO NEGOZI
   ===================================================== */

function caricaNegozi() {

  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?callback=giokriAdminNegozi&_=" +
    Date.now();


  script.onerror =
    function() {

      mostraErrore(
        "Impossibile caricare l'elenco dei negozi."
      );

    };


  document.body.appendChild(script);

}


/* =====================================================
   AVVIO DASHBOARD
   ===================================================== */

</script>

<script
  src="https://script.google.com/macros/s/AKfycbxHaUH-tBV6IjSEB6nwGXCwe-C2BZ5iw5qXO2lABAQibULYh2c2b7z--dUcHMqQpksS/exec?azione=dashboard&callback=giokriAdminDashboard">
</script>
